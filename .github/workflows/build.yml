# Builds the app in the cloud on every push, so a new APK can be downloaded to the phone without the PC.
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Cape100Coach-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # On main: replace the "latest" release's APK, so the phone can download it straight from GitHub.
      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cape100Coach.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Cape100Coach.apk --title "Latest Cape 100 Coach" --notes "Built from ${GITHUB_SHA::7}. Download Cape100Coach.apk on your phone and open it to update."
